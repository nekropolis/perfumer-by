<svg viewBox="0 -52 380 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b3b7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d3d8a;stop-opacity:1" />
    </linearGradient>
    
    <style>
      .main-text { 
        font-family: 'Segoe UI', Arial, sans-serif; 
        font-weight: 500; 
        letter-spacing: 5px; 
        fill: url(#textGradient); 
      }
      .sub-text { 
        font-family: 'Segoe UI', Arial, sans-serif; 
        font-size: 14px; 
        letter-spacing: 4px; 
        fill: #f5a3b8; 
        text-transform: uppercase;
      }
      .line {
        stroke: #4a3a6b;
        stroke-width: 1;
      }
    </style>
  </defs>

  <g transform="translate(190, 0)">
    <text x="0" y="0" text-anchor="middle" font-size="52" class="main-text">PERFUMER</text>
    
    <line x1="-185" y1="25" x2="-120" y2="25" class="line" />
    <line x1="120" y1="25" x2="185" y2="25" class="line" />
    
    <text x="0" y="30" text-anchor="middle" class="sub-text">ORIGINAL PERFUMES</text>
  </g>
</svg>
