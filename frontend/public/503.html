<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сайт временно обновляется — Perfumer</title>
  <meta name="description" content="Интернет-магазин Perfumer временно обновляется. Попробуйте открыть страницу через минуту.">
  <style>
    :root {
      --background: #F9FAFB;
      --foreground: #111827;
      --surface: #FFFFFF;
      --text-secondary: #6B7280;
      --accent: #241C15;
      --line: #E5E7EB;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.8; }
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
    }
    .code {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    h1 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--accent);
    }
    p {
      margin: 0 0 20px;
      font-size: 1rem;
      line-height: 1.55;
      color: var(--text-secondary);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--accent);
    }
    .footer {
      border-top: 1px solid var(--line);
      background: var(--surface);
      padding: 20px;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/">Perfumer</a>
      <nav class="nav" aria-label="Навигация">
        <a href="/catalog">Каталог</a>
        <a href="/brands">Бренды</a>
        <a href="/contacts">Контакты</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <div class="code">HTTP 503</div>
      <h1>Сайт временно обновляется</h1>
      <p>
        Мы обновляем интернет-магазин. Обычно это занимает меньше минуты.
        Обновите страницу чуть позже — каталог и заказы снова будут доступны.
      </p>
      <div class="actions">
        <button class="btn" type="button" onclick="location.reload()">Обновить страницу</button>
        <a class="btn btn-secondary" href="/">На главную</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    Perfumer — оригинальная парфюмерия. Спасибо за ожидание.
  </footer>
</body>
</html>
