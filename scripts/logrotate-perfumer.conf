# Logrotate config for perfumer-by.
# Install: sudo cp scripts/logrotate-perfumer.conf /etc/logrotate.d/perfumer

# Nginx
/var/log/nginx/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}

# PM2 frontend logs
/var/log/pm2/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    su deploy deploy
}

# Supervisor queue logs
/var/log/supervisor/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    su root root
}

# Laravel daily logs
/var/www/perfumer-by/backend/storage/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
    su deploy www-data
}
