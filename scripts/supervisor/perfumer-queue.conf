; Production queue worker for perfumer-by.
; Install:
;   sudo cp /var/www/perfumer-by/scripts/supervisor/perfumer-queue.conf \
;     /etc/supervisor/conf.d/perfumer-queue.conf
;   # in-place: path below is correct
;   # release-style: change artisan path to .../current/backend/artisan
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status perfumer-queue:*
;
; Timeouts must cover long jobs:
;   RunPriceRefreshJob::$timeout = 7200
;   RunSellerOne*Job::$timeout   = 7200
; so worker --timeout >= 7500 and --max-time 0 (or >= 14400).
; --max-time=3600 caused false health alerts: worker exits after long job,
; supervisor shows STARTING, cron health-check alerts.

[program:perfumer-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/perfumer-by/backend/artisan queue:work redis --tries=1 --timeout=7500 --sleep=1 --max-jobs=200 --max-time=0 --memory=768
autostart=true
autorestart=true
startretries=20
startsecs=10
stopasgroup=true
killasgroup=true
stopwaitsecs=90
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/perfumer-queue.log
