; Laravel Reverb WebSocket server
;
; Install:
;   sudo cp /var/www/perfumer-by/scripts/supervisor/perfumer-reverb.conf /etc/supervisor/conf.d/
;   sudo nano /etc/supervisor/conf.d/perfumer-reverb.conf   # проверьте путь к php (which php)
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start perfumer-reverb
;
; Если BACKOFF / Exited too quickly:
;   sudo tail -80 /var/log/supervisor/perfumer-reverb.log
;   sudo -u www-data /usr/bin/php /var/www/perfumer-by/backend/artisan reverb:start
;   ss -tlnp | grep 8080
;
; Logs:
;   /var/log/supervisor/perfumer-reverb.log

[program:perfumer-reverb]
process_name=%(program_name)s
; Полный путь к php (на сервере: which php  →  часто /usr/bin/php8.3)
command=/usr/bin/php /var/www/perfumer-by/backend/artisan reverb:start --no-ansi
directory=/var/www/perfumer-by/backend
user=www-data
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/perfumer-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
